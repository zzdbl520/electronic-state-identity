[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electronic-state-identity"
version = "0.1.0"
description = "Gauge-covariant closed-loop transport tools and verification records for multireference state tracking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]
qc = [
  "pyscf==2.13.1",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "Pillow>=9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
