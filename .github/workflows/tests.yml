name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  numerical-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/unpack_wavefunctions.py
      - run: python -m unittest discover -v
      - run: python scripts/verify_reference_results.py
      - run: sha256sum -c SHA256SUMS --quiet
      - run: python scripts/run_workflow_selftests.py
